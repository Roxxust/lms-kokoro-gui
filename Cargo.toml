[package]
name = "kokoro"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.43.0", features = ["full"] }
reqwest = { version = "0.12.12", features = ["json"] }
serde = { version = "1.0.138", features = ["derive"] }
serde_json = "1.0.140"
eframe = "0.30.0"
egui_extras = { version = "0.30", features = ["image"] }
image = { version = "0.23.14", features = ["png"] }

futures = "0.3.31"
syntect = "5.0"
rfd = "0.15.3"
simple_transcribe_rs = "1.0.4"

ort = "2.0.0-rc.9"
cpal = "0.15.3"
hound = "3.5.1"
rodio = { version = "0.20.1", default-features = false, features = ["wav"] }

base64 = "0.21"
cmudict-fast = "0.8.0"
ndarray = "0.16.1"
once_cell = "1.17.1"
bitcode = "0.6.9"
win-hotkeys = "0.5.1"
crossbeam-channel = "0.5.15"
lazy_static = "1.4.0"
regex = "1.11.1"


